<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>采集脚本配置入口</title>
<style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    body { font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; }
    /* 只画一个悬浮按钮：整页点击穿透（由脚本侧 setClickThrough 控制），不会挡住游戏操作 */
    #launcher {
        position: fixed;
        left: 12%;
        top: 88%;
        transform: translate(-50%, -50%);
        transform-origin: center center;
        display: flex; align-items: center; gap: 9px;
        width: max-content;
        max-width: none;
        white-space: nowrap;
        padding: 10px 16px 10px 12px;
        background: linear-gradient(180deg, rgba(38, 43, 55, 0.94), rgba(22, 26, 34, 0.94));
        border: 1px solid rgba(215, 182, 106, 0.55);
        border-radius: 999px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.04) inset;
        color: #f0e6cf;
        font-size: 13px;
        user-select: none;
    }
    #launcher .gear {
        width: 26px; height: 26px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        background: radial-gradient(circle at 30% 25%, #f4dfa8, #c9a75d);
        color: #241f15; font-size: 14px; font-weight: 700;
    }
    #launcher .txt { display: flex; flex-direction: column; line-height: 1.15; }
    #launcher .txt b { font-size: 13px; font-weight: 700; letter-spacing: 0.5px; }
    #launcher .txt small { font-size: 10px; color: #9fa8ba; margin-top: 2px; }
    #launcher .key {
        margin-left: 3px; padding: 2px 7px; border-radius: 6px;
        font-size: 10px; color: #d7b66a;
        border: 1px solid rgba(215, 182, 106, 0.4);
        background: rgba(215, 182, 106, 0.1);
    }
    #launcher.hidden { display: none; }
</style>
</head>
<body>
<div id="launcher">
    <div class="gear">⚙</div>
    <div class="txt"><b>配置</b><small>打开采集配置面板</small></div>
    <div class="key" id="hotkeyText">F8</div>
</div>
<script>
(function () {
    var launcher = document.getElementById('launcher');

    function post(url, data) {
        try {
            if (window.chrome && window.chrome.webview && window.chrome.webview.postMessage) {
                window.chrome.webview.postMessage(JSON.stringify({ url: url, data: data || {} }));
            }
        } catch (e) { /* ignore */ }
    }

    // 百分比换算成像素并夹在窗口内：贴边时只会被挡住一点点，不会被压扁/裁掉
    function place(xPct, yPct, scale) {
        var w = (launcher.offsetWidth || 150) * scale;
        var h = (launcher.offsetHeight || 46) * scale;
        var left = Math.min(window.innerWidth - w / 2 - 2, Math.max(w / 2 + 2, xPct / 100 * window.innerWidth));
        var top = Math.min(window.innerHeight - h / 2 - 2, Math.max(h / 2 + 2, yPct / 100 * window.innerHeight));
        launcher.style.left = left + 'px';
        launcher.style.top = top + 'px';
        launcher.style.transform = 'translate(-50%, -50%) scale(' + scale + ')';
    }

    var hotkeyEl = document.getElementById('hotkeyText');
    function hotkeyLabel(code) {
        var s = String(code || '');
        if (/^Key[A-Z]$/.test(s)) return s.slice(3);
        if (/^Digit[0-9]$/.test(s)) return s.slice(5);
        if (/^Numpad[0-9]$/.test(s)) return '小键盘' + s.slice(6);
        if (s === 'ArrowUp') return '↑';
        if (s === 'ArrowDown') return '↓';
        if (s === 'ArrowLeft') return '←';
        if (s === 'ArrowRight') return '→';
        if (s === 'Escape') return 'Esc';
        if (s === 'Space') return '空格';
        if (s === 'ControlLeft' || s === 'ControlRight') return 'Ctrl';
        if (s === 'ShiftLeft' || s === 'ShiftRight') return 'Shift';
        if (s === 'AltLeft' || s === 'AltRight') return 'Alt';
        return s || 'F8';
    }
    function applyLayout(d) {
        var x = d.x === undefined || d.x === null ? 12 : Number(d.x);
        var y = d.y === undefined || d.y === null ? 88 : Number(d.y);
        var scale = d.scale === undefined || d.scale === null ? 1 : Number(d.scale);
        if (!isFinite(x)) x = 12;
        if (!isFinite(y)) y = 88;
        if (!isFinite(scale) || scale < 0) scale = 1;
        if (d.hotkey) hotkeyEl.textContent = hotkeyLabel(d.hotkey);
        place(x, y, scale);
    }

    var bridge = window.htmlMask || (window.htmlMask = {});
    bridge.onMessage = function (message) {
        var msg = message;
        if (typeof msg === 'string') {
            try { msg = JSON.parse(msg); } catch (e) { return; }
        }
        if (!msg || !msg.url) return;
        var data = msg.data;
        if (typeof data === 'string') {
            try { data = JSON.parse(data); } catch (e) { data = {}; }
        }
        if (msg.url === '/launcher/hide') launcher.classList.add('hidden');
        if (msg.url === '/launcher/show') launcher.classList.remove('hidden');
        if (msg.url === '/launcher/config' && data) applyLayout(data);
    };

    function reportSize() {
        post('/launcher/ready', { w: window.innerWidth, h: window.innerHeight });
    }

    reportSize();
    window.addEventListener('resize', reportSize);
})();
</script>
</body>
</html>
